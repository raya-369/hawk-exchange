function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function item(id){return S.items.filter(function(i){return i.id===id})[0]}
function req(id){return S.requests.filter(function(r){return r.id===id})[0]}
function statusPill(i){
  if(i.status==='available')return '<span class="pill p-ok">Available</span>';
  if(i.status==='reserved')return '<span class="pill p-warn">Reserved</span>';
  return '<span class="pill p-mute">Borrowed</span>';
}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){e.hidden=true},2800)}
function award(n,why){S.me.stars+=n;toast('+'+n+' star'+(n>1?'s':'')+' · '+why)}
function level(){
  var cur=LV[0],next=null;
  for(var k=0;k<LV.length;k++){if(S.me.stars>=LV[k][0]){cur=LV[k];next=LV[k+1]||null}}
  return {cur:cur,next:next};
}
function ranked(){
  var all=S.board.map(function(b){return {n:b.n,s:b.s,me:false}});
  all.push({n:S.me.name+' (you)',s:S.me.stars,me:true});
  all.sort(function(a,b){return b.s-a.s||(a.me?-1:b.me?1:0)});
  return all;
}
function dayOpts(){
  var out=[],d;
  for(var k=0;k<5;k++){d=new Date();d.setDate(d.getDate()+k);out.push({k:k,label:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),date:d})}
  return out;
}
function taken(itemId,dayK,slotK){return (itemId+dayK*3+slotK)%5===0}

  var f=$('em')||$('cd');if(f)f.focus();
}

/* ---------- app shell ---------- */
function renderHeader(){
  $('hdr').innerHTML='<div class="brandrow"><h1 class="brand">Hawk <span>Exchange</span></h1><div class="hr"><span class="demo">Demo</span><button class="stars" data-act="tab" data-v="stars" aria-label="Your stars">★ '+S.me.stars+'</button></div></div><div class="brandrow"><p class="tag">Signed in as '+esc(S.user.email)+'</p><button class="link" data-act="signout">Sign out</button></div>';
}
function renderNav(){
  var open=S.requests.filter(function(r){return r.step<2}).length;
  var tabs=[['shelf','Shelf'],['board','Help board'],['stars','Stars'],['activity','Activity']];
  $('nav').innerHTML=tabs.map(function(t){
    return '<button data-act="tab" data-v="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[0]==='activity'&&open?'<span class="badge">'+open+'</span>':'')+'</button>';
  }).join('');
}

/* ---------- views ---------- */
function listHtml(){
  var q=S.q.trim().toLowerCase();
  var rows=S.items.filter(function(i){
    return (S.cat==='All'||i.cat===S.cat)&&(!q||(i.name+' '+i.cat+' '+i.desc).toLowerCase().indexOf(q)>-1);
  });
  if(!rows.length)return '<div class="empty">No items match. Try another category, or add one to the shelf.</div>';
  return rows.map(function(i){
    return '<button class="card" data-act="item" data-v="'+i.id+'">'+pic(i)+'<span class="cbody"><b>'+esc(i.name)+'</b><span class="meta">'+esc(i.owner)+' · '+esc(i.mode)+(i.dep?' · $'+i.dep+' deposit':'')+'</span><span class="meta">'+esc(i.dims)+'</span></span>'+statusPill(i)+'</button>';
  }).join('');
}
function renderList(){var l=$('list');if(l)l.innerHTML=listHtml()}

function shelfView(){
  return '<input class="search" id="q" type="text" placeholder="Search the shelf" aria-label="Search the shelf" value="'+esc(S.q)+'">'+
  '<div class="chips" role="group" aria-label="Category">'+CATS.map(function(c){return '<button class="chip" data-act="cat" data-v="'+c+'" aria-pressed="'+(S.cat===c)+'">'+c+'</button>'}).join('')+'</div>'+
  '<div class="sechead"><h2>On the shelf</h2><span class="meta">'+S.items.length+' items</span></div><div class="list" id="list">'+listHtml()+'</div>'+
  '<button class="btn fab" data-act="addItem">+ Add an item</button>';
}

function boardView(){
  var posts=S.posts.filter(function(p){return S.filter==='all'||p.type===S.filter});
  return '<div class="seg" role="group" aria-label="Filter posts">'+[['all','All'],['Ask','Asking'],['Offer','Offering']].map(function(f){return '<button data-act="filter" data-v="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>'+
  '<div class="sechead"><h2>Help board</h2><span class="meta">'+posts.length+' posts</span></div><div class="list">'+
  (posts.length?posts.map(function(p){
    var ask=p.type==='Ask';
    return '<article class="post"><div class="row"><span class="pill '+(ask?'p-warn':'p-ok')+'">'+(ask?'Asking':'Offering')+'</span><span class="pill p-mute">'+esc(p.tag)+'</span></div><h3>'+esc(p.title)+'</h3><p>'+esc(p.body)+'</p><div class="row" style="justify-content:space-between"><span class="meta">'+esc(p.who)+' · '+esc(p.role)+'</span>'+
    (p.done?'<span class="pill p-acc">'+(p.who==='You'?'Your post':ask?'You offered to help':'You asked for help')+'</span>':'<button class="btn sm" data-act="respond" data-v="'+p.id+'">'+(ask?'I can help (+3 stars)':'Ask for help')+'</button>')+'</div></article>';
  }).join(''):'<div class="empty">Nothing here yet.</div>')+'</div>'+
  '<button class="btn fab" data-act="addPost">+ New post</button>';
}

function starsView(){
  var lv=level(),pct=100,txt='You reached the top level.';
  if(lv.next){pct=Math.round((S.me.stars-lv.cur[0])/(lv.next[0]-lv.cur[0])*100);txt=(lv.next[0]-S.me.stars)+' more stars to '+lv.next[1]+'.'}
  var rk=ranked(),mine=0;rk.forEach(function(r,k){if(r.me)mine=k+1});
  return '<div class="level"><span class="meta">Your level</span><b class="big">★ '+S.me.stars+'</b><div style="font-weight:700;font-size:18px;margin-top:4px">'+esc(lv.cur[1])+'</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div><span class="meta">'+txt+' You are #'+mine+' of '+rk.length+' on the leaderboard.</span></div>'+
  '<div class="sechead"><h2>How to earn stars</h2></div><div class="post"><ul class="earn"><li><span>List an item to lend</span><b>+3</b></li><li><span>Donate an item</span><b>+5</b></li><li><span>Answer a help request</span><b>+3</b></li><li><span>Offer help on the board</span><b>+2</b></li><li><span>Return a borrowed item on time</span><b>+1</b></li></ul></div>'+
  '<div class="sechead"><h2>Leaderboard</h2><span class="meta">This semester · sample data</span></div><ol class="lb">'+
  rk.map(function(r,k){return '<li class="'+(r.me?'me':'')+'"><span class="rk '+(k<3?'r'+(k+1):'')+'">'+(k+1)+'</span><span class="nm">'+esc(r.n)+'</span><span class="sc">★ '+r.s+'</span></li>'}).join('')+'</ol>';
}

function activityView(){
  var h='<div class="stats"><div class="stat"><b>'+S.metrics.borrowed+'</b><span class="meta">Items borrowed and returned</span></div><div class="stat"><b>'+S.metrics.helped+'</b><span class="meta">Help requests answered</span></div></div>'+
  '<p class="meta" style="margin:8px 2px 0">The pilot would report these numbers to Student Development at the end of the semester.</p><div class="sechead"><h2>My pickups</h2></div>';
  if(!S.requests.length)return h+'<div class="empty">No pickups yet. Open an item on the shelf and choose a time to pick it up.</div>';
  return h+'<div class="list">'+S.requests.slice().reverse().map(function(r){
    var i=item(r.itemId),btn='',hint='';
    if(r.step===0){hint='Show this code at the hub at your pickup time.';btn='<label class="check" style="width:100%"><input type="checkbox" id="chk'+r.id+'"><span>We checked the condition together at pickup.</span></label><button class="btn sm gold" data-act="advance" data-v="'+r.id+'">Demo: pick it up at the hub</button><button class="btn sm alt" data-act="cancel" data-v="'+r.id+'">Cancel booking</button>';}
    else if(r.step===1){hint='Bring it back to the hub by '+esc(r.due)+'.'+(i.dep?' Your refundable $'+i.dep+' deposit is returned after the check.':'');btn='<label class="check" style="width:100%"><input type="checkbox" id="chk'+r.id+'"><span>We checked the condition together at return.</span></label><button class="btn sm gold" data-act="advance" data-v="'+r.id+'">Demo: return it to the hub</button>';}
    else{hint='Returned in good condition.'+(i.dep?' Deposit refunded.':'')+' Thank you for borrowing.';}
    return '<article class="post"><div class="row" style="flex-wrap:nowrap">'+pic(i,'sm')+'<div class="cbody"><b>'+esc(i.name)+'</b><span class="meta">Pickup: '+esc(r.when)+'</span><span class="meta">Return by '+esc(r.due)+'</span></div>'+(r.step===2?'<span class="pill p-ok">Complete</span>':'<span class="pill p-warn">In progress</span>')+'</div><div class="steps" aria-label="Progress">'+STEPS.map(function(s,k){return '<div class="step '+(k<r.step||r.step===2?'done':k===r.step?'now':'')+'"><i></i>'+s+'</div>'}).join('')+'</div>'+(r.step<2?'<div class="row"><span class="meta">Pickup code</span><span class="code">'+esc(r.code)+'</span></div>':'')+'<p>'+hint+'</p>'+(btn?'<div class="row">'+btn+'</div>':'')+'</article>';
  }).join('')+'</div>';
}

function render(){
  var v=$('view');
  v.innerHTML=S.tab==='shelf'?shelfView():S.tab==='board'?boardView():S.tab==='stars'?starsView():activityView();
  renderHeader();renderNav();
}

/* ---------- sheets ---------- */
function openSheet(html){$('panel').innerHTML='<button class="close" data-act="close" aria-label="Close">×</button>'+html;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true;S.sched=null;S.newPhoto=''}

function schedHtml(i){
  var sc=S.sched,days=dayOpts();
  var h='<div class="sched"><h3>Choose a pickup time</h3><label>Day</label><div class="chips" role="group" aria-label="Pickup day">'+days.map(function(d){return '<button class="chip" data-act="day" data-v="'+d.k+'" aria-pressed="'+(sc.day===d.k)+'">'+d.label+'</button>'}).join('')+'</div>';
  h+='<label>Time at the hub</label><div class="slots" role="group" aria-label="Pickup time">'+SLOTS.map(function(t,k){
    var off=sc.day===null||taken(i.id,sc.day,k);
    return '<button class="chip" data-act="time" data-v="'+k+'" aria-pressed="'+(sc.time===k)+'"'+(off?' disabled':'')+'>'+t+'</button>';
  }).join('')+'</div>'+(sc.day===null?'<p class="meta" style="margin:8px 0 0">Pick a day to see open times.</p>':'<p class="meta" style="margin:8px 0 0">Crossed-out times are already booked.</p>');
  h+='<label>Borrow for</label><div class="slots" style="grid-template-columns:repeat(3,1fr)" role="group" aria-label="Loan length">'+[1,3,7].map(function(n){return '<button class="chip" data-act="len" data-v="'+n+'" aria-pressed="'+(sc.len===n)+'">'+n+(n===1?' day':' days')+'</button>'}).join('')+'</div>';
  h+='<p style="margin:16px 0 0"><button class="btn wide" data-act="book" data-v="'+i.id+'"'+(sc.day===null||sc.time===null?' disabled':'')+'>Book pickup</button></p></div>';
  return h;
}
function itemSheet(id){
  var i=item(id);
  if(!S.sched||S.sched.id!==id)S.sched={id:id,day:null,time:null,len:3};
  var mine=S.requests.filter(function(r){return r.itemId===id&&r.step<2})[0];
  var action=i.status==='available'?schedHtml(i):mine?'<div class="note" style="margin-top:14px">You booked this for '+esc(mine.when)+'. Find your pickup code under Activity.</div>':'<div class="note" style="margin-top:14px">Someone else has this right now. Check back soon.</div>';
  openSheet(pic(i,'big')+'<h2>'+esc(i.name)+'</h2><div class="row" style="margin-top:6px">'+statusPill(i)+'<span class="pill p-mute">'+esc(i.cat)+'</span></div><p>'+esc(i.desc)+'</p><dl><dt>Dimensions</dt><dd>'+esc(i.dims)+'</dd><dt>Weight</dt><dd>'+esc(i.wt||'Not listed')+'</dd><dt>Condition</dt><dd>'+esc(i.cond)+'</dd><dt>Shared by</dt><dd>'+esc(i.owner)+' · '+esc(i.role)+'</dd><dt>Type</dt><dd>'+esc(i.mode)+'</dd><dt>Deposit</dt><dd>'+(i.dep?'$'+i.dep+', refundable at return':'None')+'</dd><dt>Pickup spot</dt><dd>'+HUB+'</dd></dl>'+action);
}
function bookedSheet(r){
  var i=item(r.itemId);
  openSheet('<h2>You are booked</h2><p>'+esc(i.name)+'</p><dl><dt>Pickup</dt><dd>'+esc(r.when)+'</dd><dt>Where</dt><dd>'+HUB+'</dd><dt>Return by</dt><dd>'+esc(r.due)+'</dd></dl><div class="row"><span class="meta">Pickup code</span><span class="code">'+esc(r.code)+'</span></div><p class="meta">Show this code at the hub. You and the lender will check the condition together.</p><p style="margin:16px 0 0"><button class="btn wide" data-act="goto" data-v="activity">See my pickups</button></p>');
}
function addItemSheet(){
  S.newPhoto='';
  openSheet('<h2>Add an item</h2><p class="meta">Share something you do not use often. It shows on the shelf right away.</p><form id="fItem"><label for="fp">Photo (optional)</label><input id="fp" type="file" accept="image/*"><div id="pv" style="margin-top:8px"></div><label for="fn">Item name</label><input id="fn" type="text" required maxlength="60" placeholder="Example: Tent, 2-person"><label for="fc">Category</label><select id="fc">'+CATS.slice(1).map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><label for="fm">Lend or donate</label><select id="fm"><option>Lend</option><option>Donate</option></select><label for="fz">Dimensions</label><input id="fz" type="text" maxlength="60" placeholder="Example: 24 × 12 × 8 in"><label for="fd">Refundable deposit (optional, whole dollars)</label><input id="fd" type="text" inputmode="numeric" placeholder="0"><label for="fs">Short description</label><textarea id="fs" maxlength="160" placeholder="Condition, what is included, anything to know"></textarea><p style="margin:16px 0 0"><button class="btn wide" type="submit">Add to shelf</button></p></form>');
  $('fn').focus();
}
function addPostSheet(){
  openSheet('<h2>New post</h2><p class="meta">Ask for a favor or offer one.</p><form id="fPost"><label for="pt">I am</label><select id="pt"><option value="Ask">Asking for help</option><option value="Offer">Offering help (+2 stars)</option></select><label for="ph">Title</label><input id="ph" type="text" required maxlength="70" placeholder="Example: Need a study partner for statistics"><label for="pb">Details</label><textarea id="pb" maxlength="200" placeholder="When, where, and anything helpful"></textarea><p style="margin:16px 0 0"><button class="btn wide" type="submit">Post to the board</button></p></form>');
  $('ph').focus();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target===$('sheet')){closeSheet();return}
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,v=b.dataset.v;
  if(a==='tab'){S.tab=v;window.scrollTo(0,0);render()}
  else if(a==='goto'){closeSheet();S.tab=v;window.scrollTo(0,0);render()}
  else if(a==='cat'){S.cat=v;render()}
  else if(a==='filter'){S.filter=v;render()}
  else if(a==='item'){itemSheet(+v)}
  else if(a==='close'){closeSheet()}
  else if(a==='addItem'){addItemSheet()}
  else if(a==='addPost'){addPostSheet()}
  else if(a==='changeEmail'){S.login.step='email';renderLogin()}
  else if(a==='signout'){S.user=null;S.login={step:'email',email:''};$('appwrap').hidden=true;$('login').hidden=false;renderLogin()}
  else if(a==='day'){S.sched.day=+v;S.sched.time=null;var s1=$('panel').scrollTop;itemSheet(S.sched.id);$('panel').scrollTop=s1}
  else if(a==='time'){S.sched.time=+v;var s2=$('panel').scrollTop;itemSheet(S.sched.id);$('panel').scrollTop=s2}
  else if(a==='len'){S.sched.len=+v;var s3=$('panel').scrollTop;itemSheet(S.sched.id);$('panel').scrollTop=s3}
  else if(a==='book'){
    var i=item(+v),sc=S.sched,d=dayOpts()[sc.day],due=new Date(d.date);due.setDate(due.getDate()+sc.len);
    var r={id:S.nextId++,itemId:i.id,step:0,when:d.label+' at '+SLOTS[sc.time],due:due.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),code:'HX-'+(4000+(S.nextId*37)%5000)};
    S.requests.push(r);i.status='reserved';S.sched=null;bookedSheet(r);render();
  }
  else if(a==='cancel'){var r2=req(+v);item(r2.itemId).status='available';S.requests=S.requests.filter(function(x){return x!==r2});toast('Booking canceled');render()}
  else if(a==='advance'){
    var r3=req(+v),it=item(r3.itemId),c=$('chk'+r3.id);
    if(c&&!c.checked){toast('Check the box to confirm the condition');return}
    r3.step++;
    if(r3.step===1){it.status='borrowed';toast('Picked up. Enjoy it!')}
    else{it.status='available';S.metrics.borrowed++;award(1,'returned on time')}
    render();
  }
  else if(a==='respond'){var p=S.posts.filter(function(x){return x.id===+v})[0];p.done=true;
    if(p.type==='Ask'){S.metrics.helped++;award(3,'answered a help request')}else toast('Your request was sent to '+p.who+' (demo)');render()}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;renderList()}});
document.addEventListener('change',function(e){
  if(e.target.id==='fp'&&e.target.files&&e.target.files[0]){
    var fr=new FileReader();
    fr.onload=function(){S.newPhoto=fr.result;$('pv').innerHTML='<span class="pic big" style="height:140px"><img src="'+S.newPhoto+'" alt="Preview of your photo"></span>'};
    fr.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
document.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(id==='fEmail'){
    var em=$('em').value.trim();S.login.email=em;
    if(!em){renderLogin('Enter your Warhawk email.');return}
    if(!EMAIL_RE.test(em)){renderLogin('Hawk Exchange is only for ULM accounts. Use your @warhawks.ulm.edu address (faculty and staff: @ulm.edu).');return}
    S.login.step='code';renderLogin();
  }else if(id==='fCode'){
    var cd=$('cd').value.trim();
    if(!/^\d{6}$/.test(cd)){renderLogin('Enter the 6-digit code.');return}
    var em2=S.login.email.toLowerCase(),local=em2.split('@')[0].replace(/[0-9]+/g,'').split(/[._-]/)[0]||'you';
    S.user={email:em2,staff:/@ulm\.edu$/.test(em2)};
    S.me.name=local.charAt(0).toUpperCase()+local.slice(1);
    $('login').hidden=true;$('appwrap').hidden=false;S.tab='shelf';window.scrollTo(0,0);render();toast('Welcome to Hawk Exchange, '+S.me.name);
  }else if(id==='fItem'){
    var d=parseInt($('fd').value,10),mode=$('fm').value;
    S.items.unshift({id:S.nextId++,photo:S.newPhoto,name:$('fn').value.trim(),cat:$('fc').value,owner:'You',role:S.user.staff?'Faculty/Staff':'Student',cond:'Good',mode:mode,dep:isNaN(d)||d<0?0:d,dims:$('fz').value.trim()||'Dimensions not listed',wt:'',status:'available',desc:$('fs').value.trim()||'No description yet.'});
    S.tab='shelf';S.cat='All';S.q='';closeSheet();render();award(mode==='Donate'?5:3,mode==='Donate'?'donated an item':'listed an item');
  }else if(id==='fPost'){
    var type=$('pt').value;
    S.posts.unshift({id:S.nextId++,type:type,title:$('ph').value.trim(),body:$('pb').value.trim()||'No details yet.',who:'You',role:S.user.staff?'Faculty/Staff':'Student',tag:'New',done:true});
    S.tab='board';S.filter='all';closeSheet();render();
    if(type==='Offer')award(2,'offered help');else toast('Posted to the help board');
  }
});
renderLogin();
})();
</script>

</body></html>
